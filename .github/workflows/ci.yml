name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Pytest
        env:
          RAG_DB_PASSWORD: ci
          ZABBIX_DB_PASSWORD: ci
          OPENAI_API_KEY: sk-ci-dummy
        run: pytest tests/ -q
